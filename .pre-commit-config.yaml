repos:
  - repo: local
    hooks:
      - id: import-linter
        name: Check architectural import contracts
        entry: hatch run lint-imports
        language: system
        pass_filenames: false

  # Black - auto-format Python code
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3

  # isort - sort imports
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # flake8 - check code style
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-pytest-style  # pytest-specific flake8 rules
        args:
          - "--max-line-length=88"
          - "--extend-ignore=E203"

  # Pre-commit hooks - file content checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
