[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "book-store-website"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask",
]

[tool.hatch.envs.default]
dependencies = [
    "pytest",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
